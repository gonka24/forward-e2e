# Runner-generated compose overlay (A8 immutable-source runner).
#
# Replaces what the removed DockerGroup.kt patch wrote at run time as
# prod-local/docker-compose.testermint-nats-bind.yml: the api's NATS state is
# bound to its own per-pair directory, prod-local/nats/<pair>, which the runner
# prepares (prepare_network_root) instead of Testermint's dockerBindOwner.
# Relative paths resolve against --project-directory, i.e. GONKA_REPO_ROOT =
# <W>/network-root (upstream's own ./local-test-net/dns/Corefile mount relies on
# the same rule).
#
# The bounded restart policy replaces the old "retry the join stack once" patch:
# Docker restarts a crashed api at most three times; a manual `docker stop` by
# container_control.py is never undone by an on-failure policy.
services:
  api:
    volumes:
      - ./prod-local/nats/${KEY_NAME}:/root/.nats
    restart: "on-failure:3"
